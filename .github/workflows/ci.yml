# Every check a change must pass, on every push and pull request: the types, the strings, the generated
# pages, the dependencies' advisories, the unit tests under node, the browser tests in Chromium, and the
# build. Branch protection on main requires this job (docs/github-setup.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run lint
      - name: Strings
        run: npm run i18n:check
      - name: What leaves the browser (docs/network.md)
        run: |
          if node -e "process.exit(require('./package.json').scripts['docs:network'] ? 0 : 1)"; then
            npm run docs:network -- --check
          else
            echo "No docs:network script on this branch yet."
          fi
      - name: Dependencies (docs/dependencies.md)
        run: |
          if node -e "process.exit(require('./package.json').scripts['docs:deps'] ? 0 : 1)"; then
            npm run docs:deps -- --check
          else
            echo "No docs:deps script on this branch yet."
          fi
      - name: Advisories, with no ignores
        run: npm audit
      - name: Unit tests (node)
        run: npx vitest run --project unit
      - name: Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (the kit and every editor, in Chromium)
        run: npx vitest run --project browser
      - name: Build
        run: npm run build
