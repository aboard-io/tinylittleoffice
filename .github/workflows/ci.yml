# Every check a deploy runs (scripts/deploy.mjs, held to it by test/repository.test.ts), on every push to main and
# every pull request, with no secret: the types, the strings, the unit tests under node, the browser tests in
# Chromium, the build (whose budgets are a tripwire: a file over budgets.json, or a build of another shape, fails
# it), the smoke run on the built site in desktop Chromium and a phone-sized WebKit (offline under Save in browser
# too), and the policy and version the build writes. Then the lints and Prettier, the dependencies' advisories, and the
# build made twice more to show it is the same bytes. Branch protection on main requires the job `check`
# (docs/self-host.md, "From GitHub, on a tag"). A deploy is a tag: .github/workflows/deploy.yml.
# Every action is pinned by its commit, the version beside it (test/deploy.test.ts).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by .github/workflows/dependencies.yml on a Dependabot branch it has committed to.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The smoke run's preview port (playwright.config.ts).
      PW_PORT: 4179
      # The address the site is published at, as deploy.yml names it: without one the build writes no sitemap and
      # check-build says so (the v1.1.3 CI run on main stopped there, 2026-10-12).
      VITE_SITE_URL: https://tinylittleoffice.com/
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # build:verify checks the commit out again, by its history.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chromium and WebKit, with what they need
        run: npx playwright install --with-deps chromium webkit
      - name: The fonts the measuring tests draw each script in (test/browser/fonts.ts)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core fonts-noto-cjk fonts-noto-extra
          # As on the box the tests were calibrated on: Latin and Cyrillic in DejaVu Sans, not in Noto Sans.
          printf '%s\n' '<?xml version="1.0"?>' '<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">' '<fontconfig>' \
            '  <alias binding="strong"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>' \
            '  <alias binding="strong"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>' \
            '</fontconfig>' | sudo tee /etc/fonts/local.conf > /dev/null
          if [ -f scripts/fonts-box.sh ]; then bash scripts/fonts-box.sh; fi
          fc-cache -f > /dev/null
      - name: Types
        run: npm run typecheck
      - name: Strings
        run: npm run i18n:check
      - name: Unit tests (node)
        run: npm run test:unit
      - name: Browser tests (the kit and every editor, in Chromium)
        run: npm run test:browser
      - name: Build, and the build against budgets.json
        run: npm run build
      - name: The smoke run on the built site (desktop Chromium, phone WebKit)
        run: npx playwright test e2e/smoke.spec.ts e2e/keyboard.spec.ts e2e/a11y.spec.ts e2e/offline.spec.ts
      - name: The policy and the version
        run: node scripts/check-build.ts
      - name: The lints, Prettier and the generated pages
        run: npm run lint
      - name: Advisories, with no ignores
        run: npm audit
      - name: The same bytes, built twice (scripts/reproducible.ts)
        run: npm run build:verify
