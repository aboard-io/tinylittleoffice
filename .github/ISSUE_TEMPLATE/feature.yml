name: A feature
description: Something Tiny Little Office could do, or do better.
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Tiny Little Office is small on purpose: a feature that makes a thing simpler is likelier to land than one
        that adds a setting.
  - type: textarea
    id: need
    attributes:
      label: What you were trying to do
      description: The document you were making, and where the app got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Which app, if one
