name: Something is wrong
description: An app, the editor or the site does something it should not, or fails to do what it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A security problem is not an issue: report it privately (SECURITY.md).
  - type: input
    id: app
    attributes:
      label: Which app
      placeholder: Word Processor, Spreadsheet, the home page…
    validations:
      required: true
  - type: textarea
    id: link
    attributes:
      label: The link that shows it
      description: |
        A link holds its whole document, and this issue is public. Make a document that shows the problem with
        nothing private in it (or take out what is private and check it still shows), and paste its link here.
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps, one per line, from opening the link or the app.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser and device
      placeholder: Safari on an iPhone 15, iOS 19; Firefox 140 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: by
    attributes:
      label: Done by
      multiple: true
      options:
        - Keyboard
        - Mouse or trackpad
        - Finger (touch)
        - A screen reader
