server {
    listen 8000 default_server;
    root /srv/www/tinyoffice;
    index index.html;
    # No request log. A document lives after the "#" and never reaches this server at all;
    # this keeps even which pages were asked for, and by whom, off the disk.
    access_log off;
    # Redirects (/deck -> /deck/) stay relative, so they survive the HTTPS proxy in front.
    absolute_redirect off;

    # Scripts and styles go compressed: the build writes a .gz beside every text file (scripts/precompress.mjs),
    # served as it is; anything without one is compressed on the way out.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/manifest+json;

    # Headers for every response. The site is its own only source of code and
    # style (its UI library reads its own small icons as data: addresses); pictures and places come from OpenStreetMap; nothing may embed
    # the editor, though a document's own ".embed" view may be embedded anywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' data: https://tile.openstreetmap.org https://nominatim.openstreetmap.org https://tinier.tinylittleoffice.com; worker-src 'self'; frame-src 'self' about: blob:; object-src 'none'; base-uri 'self'; form-action 'self' mailto:" always;

    # (Caching is set with "expires" so the headers above still apply in every location.)
    location /assets/ {
        expires max;
    }
    # For programs: the API as a module, its types, the guide and the small link-maker; any site may import them.
    location ~ ^/(api\.js|api\.d\.ts|tinyoffice\.js|llms\.txt|files\.json)$ {
        expires -1;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires -1;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}

# tinier.tinylittleoffice.com: the link shortener, a small Node service on :8010 that stores only ciphertext.
server {
    listen 8000;
    server_name tinier.tinylittleoffice.com;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        client_max_body_size 32k;
    }
}
