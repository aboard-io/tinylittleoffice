server {
    listen 8000 default_server;
    root /srv/www/tinyoffice;
    index index.html;
    # No request log. A document lives after the "#" and never reaches this server at all;
    # this keeps even which pages were asked for, and by whom, off the disk.
    access_log off;
    # Redirects (/deck -> /deck/) stay relative, so they survive the HTTPS proxy in front.
    absolute_redirect off;

    # Headers for every response. The site is its own only source of code and
    # style (its UI library reads its own small icons as data: addresses); pictures and places come from OpenStreetMap; nothing may embed
    # the editor, though a document's own ".embed" view may be embedded anywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' data: https://tile.openstreetmap.org https://nominatim.openstreetmap.org; worker-src 'self'; frame-src 'self' about: blob:; object-src 'none'; base-uri 'self'; form-action 'self' mailto:" always;

    # (Caching is set with "expires" so the headers above still apply in every location.)
    location /assets/ {
        expires max;
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires -1;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
