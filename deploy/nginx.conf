server {
    listen 8000 default_server;
    root /srv/www/tinyoffice;
    index index.html;
    # No request log. A document lives after the "#" and never reaches this server at all;
    # this keeps even which pages were asked for, and by whom, off the disk.
    access_log off;
    # Redirects (/deck -> /deck/) stay relative, so they survive the HTTPS proxy in front.
    absolute_redirect off;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
