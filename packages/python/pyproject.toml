[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinylittleoffice"
version = "0.1.0"
description = "Make and read TinyLittleOffice documents: links that carry the whole document, no server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["tinylittleoffice", "documents", "agents", "url"]

[project.urls]
Homepage = "https://tinylittleoffice.com/"
Source = "https://github.com/ftrain/tinyoffice"
