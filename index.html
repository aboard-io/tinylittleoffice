<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Tiny Little Office</title>
    <meta name="description" content="A tiny office suite where the link is the document. No accounts. Nothing is saved anywhere unless you choose to keep it on this device." />
    <meta name="application-name" content="Tiny Little Office" />
    <meta name="apple-mobile-web-app-title" content="Tiny Little Office" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="no-referrer" />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- The type, IBM Plex, is the site's own (src/styles/fonts.css): the face every page draws first, fetched at once. -->
    <link rel="preload" href="./fonts/IBMPlexSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Link previews. A document lives in the part of the address after "#", which is never sent to a server,
         so every Tiny Little Office link previews as this same card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tiny Little Office" />
    <meta property="og:title" content="Tiny Little Office: the link is the document" />
    <meta property="og:description" content="A tiny office suite where the link is the document. No accounts. Nothing is saved anywhere unless you choose to keep it on this device." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tiny Little Office: a tiny office suite where the link is the document." />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="./theme.js"></script>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <to-shell></to-shell>
    <noscript>
      <h1>Tiny Little Office</h1>
      <p>A tiny office suite where the link is the document. No accounts. Nothing is saved anywhere unless you choose to keep it on this device. Tiny Little Office needs JavaScript to show a document.</p>
    </noscript>
  </body>
</html>
